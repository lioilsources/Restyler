name: Release iOS

# From Distribution/workflows/release-ios.yml, adapted for Restyler:
# - the parser weights are not in git: downloaded from the backend, cached;
# - RESTYLER_APP_TOKEN goes in through --dart-define;
# - no GitHub Release: the repo is public and the IPA carries the app token;
# - manual signing is patched into the Release config only here, so local
#   `make run` keeps automatic signing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS → TestFlight
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Cache parser models
        uses: actions/cache@v4
        with:
          path: assets/models/*.onnx
          key: models-${{ hashFiles('Makefile') }}

      - name: Fetch parser models
        env:
          RESTYLER_APP_TOKEN: ${{ secrets.RESTYLER_APP_TOKEN }}
        run: |
          tools/fetch_models.sh
          make models

      - name: Install dependencies
        run: flutter pub get

      - name: Set version from tag
        run: |
          # The release tag is the version: v1.2.3 or v1.2.3-beta -> 1.2.3.
          # Manual runs (no tag) keep pubspec's.
          BASE=$(grep '^version:' pubspec.yaml | sed -E 's/^version: ([0-9.]+).*/\1/')
          TAG="${GITHUB_REF_NAME#v}"
          TAG="${TAG%%-*}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            BASE="$TAG"
          fi
          NEW="${BASE}+${{ github.run_number }}"
          sed -i.bak -E "s/^version: .*/version: ${NEW}/" pubspec.yaml
          rm -f pubspec.yaml.bak
          echo "Build version: ${NEW}"

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Import signing certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$CERTIFICATE_P12_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode > $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          DECODED=$(security cms -D -i "$PP_PATH")
          UUID=$(echo "$DECODED" | plutil -extract UUID raw -)
          NAME=$(echo "$DECODED" | plutil -extract Name raw -)
          TEAM=$(echo "$DECODED" | plutil -extract TeamIdentifier.0 raw -)
          APP_ID=$(echo "$DECODED" | plutil -extract Entitlements.application-identifier raw -)
          echo "Profile: $NAME ($UUID), team $TEAM, app $APP_ID"
          if [[ "$APP_ID" != "$TEAM.com.ol1n.restyler" ]]; then
            echo "::error::profile is for $APP_ID, not com.ol1n.restyler"
            exit 1
          fi
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "PROFILE_NAME=$NAME" >> $GITHUB_ENV
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV
          echo "PROFILE_TEAM_ID=$TEAM" >> $GITHUB_ENV

      - name: Switch the Runner Release config to manual signing
        run: |
          # Only the Runner target's Release config; pod targets keep their own
          # signing, and nothing goes on the xcodebuild command line.
          python3 - <<'EOF'
          import os
          from pathlib import Path
          p = Path("ios/Runner.xcodeproj/project.pbxproj")
          s = p.read_text()
          head = "97C147071CF9000F007C117D /* Release */ = {"
          start = s.index(head)
          at = s.index("buildSettings = {\n", start) + len("buildSettings = {\n")
          end = s.index("name = Release;", start)
          block = s[at:end]
          for key in ("DEVELOPMENT_TEAM", "CODE_SIGN_STYLE", "CODE_SIGN_IDENTITY",
                      "PROVISIONING_PROFILE_SPECIFIER"):
              block = "".join(l for l in block.splitlines(True) if not l.strip().startswith(key))
          ins = (
              '\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n'
              "\t\t\t\tCODE_SIGN_STYLE = Manual;\n"
              f"\t\t\t\tDEVELOPMENT_TEAM = {os.environ['PROFILE_TEAM_ID']};\n"
              f"\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"{os.environ['PROFILE_UUID']}\";\n"
          )
          p.write_text(s[:at] + ins + block + s[end:])
          EOF
          plutil -lint ios/Runner.xcodeproj/project.pbxproj
          grep -nE 'PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_STYLE = Manual' ios/Runner.xcodeproj/project.pbxproj

      - name: Build Flutter iOS (no codesign)
        env:
          RESTYLER_APP_TOKEN: ${{ secrets.RESTYLER_APP_TOKEN }}
          RESTYLER_USER: ${{ secrets.RESTYLER_USER }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=RESTYLER_APP_TOKEN="$RESTYLER_APP_TOKEN" \
            --dart-define=RESTYLER_USER="$RESTYLER_USER"

      - name: Archive with manual signing
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Runner.xcarchive

      - name: Export IPA
        run: |
          /usr/libexec/PlistBuddy -c "Set :teamID $PROFILE_TEAM_ID" ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.ol1n.restyler $PROFILE_NAME" ios/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/ipa

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          # Bitwarden's issuer item is empty, so the setup script stores junk:
          # fail here with a clear message instead of inside altool.
          if [[ ${#API_ISSUER_ID} -ne 36 ]]; then
            echo "::error::APPSTORE_ISSUER_ID is ${#API_ISSUER_ID} chars, expected a 36-char UUID"
            exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          xcrun altool --upload-app \
            --type ios \
            --file "$(ls $RUNNER_TEMP/ipa/*.ipa)" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
